<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#ffffff"/>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#111827}.head{font:700 25px Arial,sans-serif;fill:#111827}
    .pin{font:700 18px Arial,sans-serif;fill:#ffffff}.txt{font:18px Arial,sans-serif;fill:#111827}
    .small{font:16px Arial,sans-serif;fill:#374151}.box{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}
  </style>
  <text x="600" y="55" text-anchor="middle" class="title">Wemos D1 mini + LCD 16x2 I2C</text>
  <text x="250" y="115" text-anchor="middle" class="head">Wemos D1 mini (ESP8266)</text>
  <text x="910" y="115" text-anchor="middle" class="head">LCD 16x2 + PCF8574</text>

  <rect x="105" y="150" width="290" height="410" rx="24" fill="#1769aa" stroke="#0f4f82" stroke-width="4"/>
  <rect x="165" y="205" width="170" height="150" rx="8" fill="#c9ced3" stroke="#6b7280" stroke-width="3"/>
  <text x="250" y="272" text-anchor="middle" class="head">ESP8266</text>
  <text x="250" y="302" text-anchor="middle" class="small">D1 mini</text>
  <rect x="205" y="525" width="90" height="35" rx="4" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>

  <circle cx="380" cy="190" r="8" fill="#111827"/><text x="355" y="197" text-anchor="end" class="pin">5V</text>
  <circle cx="380" cy="260" r="8" fill="#111827"/><text x="355" y="267" text-anchor="end" class="pin">G</text>
  <circle cx="380" cy="330" r="8" fill="#111827"/><text x="355" y="337" text-anchor="end" class="pin">D2</text>
  <circle cx="380" cy="400" r="8" fill="#111827"/><text x="355" y="407" text-anchor="end" class="pin">D1</text>
  <text x="240" y="595" text-anchor="middle" class="small">D2 = GPIO4 (SDA) · D1 = GPIO5 (SCL)</text>

  <rect x="785" y="145" width="310" height="170" rx="12" fill="#111827" stroke="#374151" stroke-width="4"/>
  <rect x="745" y="340" width="390" height="220" rx="12" fill="#2f8f46" stroke="#176c34" stroke-width="4"/>
  <rect x="790" y="390" width="300" height="105" rx="10" fill="#9db33e" stroke="#111827" stroke-width="12"/>
  <text x="940" y="535" text-anchor="middle" class="small">LCD 16x2</text>

  <circle cx="800" cy="190" r="8" fill="#111827"/><text x="820" y="197" class="pin">VCC</text>
  <circle cx="800" cy="260" r="8" fill="#111827"/><text x="820" y="267" class="pin">GND</text>
  <circle cx="800" cy="330" r="8" fill="#111827"/><text x="820" y="337" class="pin">SDA</text>
  <circle cx="800" cy="400" r="8" fill="#111827"/><text x="820" y="407" class="pin">SCL</text>

  <path d="M388 190 H792" fill="none" stroke="#dc2626" stroke-width="7"/>
  <path d="M388 260 H792" fill="none" stroke="#111827" stroke-width="7"/>
  <path d="M388 330 H792" fill="none" stroke="#16a34a" stroke-width="7"/>
  <path d="M388 400 H792" fill="none" stroke="#2563eb" stroke-width="7"/>

  <rect x="120" y="635" width="960" height="90" rx="12" class="box"/>
  <text x="160" y="673" class="txt">5V → VCC</text>
  <text x="360" y="673" class="txt">G → GND</text>
  <text x="555" y="673" class="txt">D2 / GPIO4 → SDA</text>
  <text x="810" y="673" class="txt">D1 / GPIO5 → SCL</text>
  <text x="600" y="705" text-anchor="middle" class="small">Typowy adres I2C: 0x27 (czasem 0x3F) · Serial Monitor: 115200</text>
</svg>